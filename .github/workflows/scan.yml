name: Scan eBay
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python watch_scanner.py
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
      - run: |
          mkdir -p docs
          cp report.html docs/index.html
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          git add docs/index.html watches.db
          git commit -m "hourly scan" || echo "nothing to commit"
          git push
